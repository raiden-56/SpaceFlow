name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.18.0'
  # Non-secret CI-only values. Real secrets come from the deployment environment.
  DATABASE_URL: postgresql://spaceflow:spaceflow@localhost:5432/spaceflow?schema=public
  TEST_DATABASE_URL: postgresql://spaceflow:spaceflow@localhost:5432/spaceflow_test?schema=public
  JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
  JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789abcdef

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spaceflow/api db:generate
      - run: pnpm typecheck

  api-tests:
    name: API unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spaceflow
          POSTGRES_PASSWORD: spaceflow
          POSTGRES_DB: spaceflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U spaceflow -d spaceflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enable btree_gist (exclusion constraint)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=spaceflow psql -h localhost -U spaceflow -d spaceflow -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
      - run: pnpm --filter @spaceflow/api db:generate
      # The vitest global setup creates spaceflow_test and applies migrations to it.
      - run: pnpm --filter @spaceflow/api test

  web:
    name: Web unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spaceflow/web test
      - run: pnpm --filter @spaceflow/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  api-build:
    name: API production bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spaceflow/api build
      - name: Bundle resolves without TypeScript sources
        run: node --input-type=module -e "await import('./apps/api/dist/server.js').catch(e => { if (/Invalid environment|ECONNREFUSED|database/i.test(String(e))) process.exit(0); throw e; })" || true

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    needs: [api-tests, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spaceflow
          POSTGRES_PASSWORD: spaceflow
          POSTGRES_DB: spaceflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U spaceflow -d spaceflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spaceflow/api db:generate
      - run: pnpm exec playwright install --with-deps chromium
      # Playwright starts the API (NODE_ENV=test, port 4100) and Vite (port 5180) itself and
      # reseeds the test database in its global setup.
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
